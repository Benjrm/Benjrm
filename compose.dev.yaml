services:
  benjrm:
    build:
      context: .
      dockerfile: Dockerfile.dev.backend
    depends_on:
      frontend:
        condition: service_started
      idp:
        condition: service_healthy
    env_file: .env
    environment:
      - FRONTEND_HOST=frontend
    volumes:
      - ./config:/config
    ports:
      - "80:80"

  idp:
    image: voidauth/voidauth:1.15.1
    restart: unless-stopped
    volumes:
      - ./idp/config:/app/config
      - ./idp/data:/app/db
    networks:
      default:
        aliases:
          - ${DOMAIN}
    environment:
      APP_URL: ${OIDC_PUBLIC_IDP_URL}
      DB_ADAPTER: ${IDP_DB_ADAPTER}
      STORAGE_KEY: ${IDP_STORAGE_KEY}
      SIGNUP: ${IDP_SIGNUP}
      SIGNUP_REQUIRES_APPROVAL: ${IDP_APPROVAL_REQUIRED}
      OIDC_BENJRM_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_BENJRM_CLIENT_DISPLAY_NAME: ${OIDC_CLIENT_NAME}
      OIDC_BENJRM_CLIENT_HOMEPAGE_URL: ${PUBLIC_URL}
      OIDC_BENJRM_CLIENT_REDIRECT_URLS: ${PUBLIC_URL}/auth/oidc/callback
      OIDC_BENJRM_CLIENT_POST_LOGOUT_URLS: ${PUBLIC_URL}/*
      OIDC_BENJRM_CLIENT_SKIP_CONSENT: ${IDP_CLIENT_SKIP_CONSENT}
      OIDC_BENJRM_CLIENT_GRANT_TYPES: authorization_code

    healthcheck:
      start_period: 5s
      start_interval: 2s
      interval: 2s
      timeout: 2s
      retries: 10
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      # Forward the local user IDs so the frontend container can write to bind mounts on Linux.
      args:
        APP_UID: ${UID:-1000}
        APP_GID: ${GID:-1000}
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    ports:
      - "5173:5173"