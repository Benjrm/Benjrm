[package]
name = "benjrm"
version = "0.1.0"
edition = "2024"

[dependencies]
actix = "0.13.5"
actix-proxy = "0.2.0"
actix-security = { git = "https://github.com/Benjrm/actix-security", features = ["oauth2"] }
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.16.0"
actix-web-actors = "4.3.1"
actix-ws = "0.4.0"
async-trait = "0.1.92"
awc = { version = "3.8.2", features = ["rustls"] }
build-time = "0.1.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
dotenvy = "0.15.7"
emojis = { version = "0.9.0", features = ["serde"]}
env_logger = "0.11.11"
futures = "0.3.34"
is-truthy = "0.1.2"
lazy_static = "1.5.1"
local-ip-address = "0.6.13"
log = "0.4.34"
migration = { path = "../database-migrator" }
oauth2 = "4.4.2"
openidconnect = "3.5.0"
openssl = { version = "0.10", features = ["vendored"] }
paste = "1.0.15"
rand = "0.10.3"
redis = { version = "1.7.1", features = ["connection-manager", "tokio-comp", "cluster-async"] }
sea-orm = { version = "2.0.4", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "uuid"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-value = "0.7.0"
serde_json = "1.0.154"
static-files = "0.3.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs"] }
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.28.0", features = ["v4"] }

[build-dependencies]
static-files = "0.3.1"
